<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera de Repositorio | VentaniYA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-white: #ffffff;
            --neon-pink: #ff007f;
            --bg-dark: #050814;
            --panel-bg: #0b1120;
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-white);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(180deg, #0a1128 0%, #050814 100%);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: var(--border-glow);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
            letter-spacing: 2px;
        }

        .brand p { font-size: 0.85rem; color: #8ab4f8; letter-spacing: 1px; }

        .casio-clock-container {
            background: #000;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3) inset, 0 0 10px var(--neon-blue);
            padding: 8px 16px;
            border-radius: 4px;
            text-align: right;
        }

        .time-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            letter-spacing: 2px;
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--neon-white);
            text-shadow: 0 0 8px var(--neon-white);
            letter-spacing: 1px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 420px;
            flex: 1;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .gallery-section { display: flex; flex-direction: column; gap: 15px; }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--neon-blue);
            border-left: 4px solid var(--neon-blue);
            padding-left: 10px;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .grid-estampas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .grid-estampas::-webkit-scrollbar { width: 6px; }
        .grid-estampas::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 3px; }

        .estampa-card {
            background: var(--panel-bg);
            border: 1px solid #1e293b;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .estampa-card:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
            transform: translateY(-2px);
        }

        .estampa-card.selected {
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .estampa-thumb { width: 100%; height: 110px; object-fit: cover; background: #000; }
        .estampa-info { padding: 6px; font-size: 0.75rem; }
        .estampa-id { color: var(--neon-blue); font-weight: bold; }
        .estampa-hash { color: #94a3b8; font-size: 0.65rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .editor-panel {
            background: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            box-shadow: var(--border-glow);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            height: fit-content;
        }

        .editor-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; color: var(--neon-blue); letter-spacing: 1px; font-weight: bold; }
        
        .form-group input {
            background: #000;
            border: 1px solid var(--neon-blue);
            color: var(--neon-white);
            padding: 10px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.05rem;
        }

        .form-group input[type="file"] {
            padding: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            border-color: var(--neon-pink);
        }

        .preview-container {
            width: 100%;
            background: #000;
            border: 1px dashed var(--neon-blue);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 180px;
        }

        #preview-canvas { max-width: 100%; height: auto; display: block; }

        .btn-action {
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border: none;
            padding: 14px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            transition: all 0.2s;
            text-align: center;
        }

        .btn-action:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>VENTANIYA</h1>
            <p>LA VÍA DEL MILISEGUNDO // CARTELERA DE REPOSITORIO</p>
        </div>
        <div class="casio-clock-container">
            <div id="live-time" class="time-display">00:00:00.000</div>
            <div id="live-date" class="date-display">00.XXX.0000</div>
        </div>
    </header>

    <div class="main-layout">
        <div class="gallery-section">
            <div class="section-title" id="gallery-title">Estampas del Repositorio</div>
            <!-- Lista fija cargada directo desde tu repositorio -->
            <div class="grid-estampas" id="gridEstampas"></div>
        </div>

        <div class="editor-panel">
            <div class="editor-title" id="editor-panel-title">Avisador de la Estampa</div>
            
            <div class="form-group">
                <label>Logo del Auspiciante:</label>
                <input type="file" id="sponsorLogoFile" accept="image/*">
            </div>

            <div class="form-group">
                <label>Nombre del Comercio:</label>
                <input type="text" id="sponsorName">
            </div>

            <div class="form-group">
                <label>Teléfono de Contacto:</label>
                <input type="text" id="sponsorPhone">
            </div>

            <div class="form-group">
                <label>Dirección / Ubicación:</label>
                <input type="text" id="sponsorAddress">
            </div>

            <div class="form-group">
                <label>Instagram / Mensaje (IG):</label>
                <input type="text" id="sponsorMsg">
            </div>

            <div class="form-group">
                <label>Vista Previa:</label>
                <div class="preview-container">
                    <canvas id="preview-canvas" width="600" height="600"></canvas>
                </div>
            </div>

            <button class="btn-action" id="btnDownload">Descargar Estampa Sellada</button>
        </div>
    </div>

    <script>
        const mesesShort = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SET", "OCT", "NOV", "DIC"];

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ms = String(now.getMilliseconds()).padStart(3, '0');
            document.getElementById('live-time').textContent = `${h}:${m}:${s}.${ms}`;

            const day = String(now.getDate()).padStart(2, '0');
            const month = mesesShort[now.getMonth()];
            const year = now.getFullYear();
            document.getElementById('live-date').textContent = `${day}.${month}.${year}`;
        }
        setInterval(updateClock, 30);

        // =========================================================================
        // AQUÍ AGREGAS LAS IMÁGENES QUE YA TIENES SUBIDAS A TU REPOSITORIO DE GITHUB
        // =========================================================================
        const misEstampasDelRepo = [
            {
                id: 1,
                nombreArchivo: "fora.png", // <--- Pon aquí exacto el nombre de tu archivo en el repo
                url: "fora.png",           // <--- Si está en una carpeta, pon "carpeta/fora.png"
                hash: "repo#fora001"
            },
            {
                id: 2,
                nombreArchivo: "estampa2.png", // <--- Agrega todas las que quieras que queden fijas
                url: "estampa2.png",
                hash: "repo#est002"
            }
        ];

        let selectedEstampa = null;
        const grid = document.getElementById('gridEstampas');

        function getStorageKey(nombre) {
            return `ventaniya_aviso_fijo_${nombre}`;
        }

        function loadSponsorData() {
            if (!selectedEstampa) return;
            const saved = JSON.parse(localStorage.getItem(getStorageKey(selectedEstampa.nombreArchivo)));

            // Si ya tiene datos guardados los usa, sino pone un valor por defecto limpio
            document.getElementById('sponsorName').value = saved ? saved.name : "COMERCIO AUSPICIANTE";
            document.getElementById('sponsorPhone').value = saved ? saved.phone : "+54 9 11 0000-0000";
            document.getElementById('sponsorAddress').value = saved ? saved.address : "Av. Principal 123";
            document.getElementById('sponsorMsg').value = saved ? saved.msg : "@tucomercio";
            selectedEstampa.logo = saved ? saved.logo : null;
        }

        function saveSponsorData() {
            if (!selectedEstampa) return;
            const data = {
                name: document.getElementById('sponsorName').value,
                phone: document.getElementById('sponsorPhone').value,
                address: document.getElementById('sponsorAddress').value,
                msg: document.getElementById('sponsorMsg').value,
                logo: selectedEstampa.logo
            };
            localStorage.setItem(getStorageKey(selectedEstampa.nombreArchivo), JSON.stringify(data));
        }

        document.getElementById('sponsorLogoFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && selectedEstampa) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedEstampa.logo = event.target.result;
                    saveSponsorData();
                    redrawCanvas();
                }
                reader.readAsDataURL(file);
            }
        });

        function inicializar() {
            grid.innerHTML = '';
            misEstampasDelRepo.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `estampa-card ${index === 0 ? 'selected' : ''}`;
                card.innerHTML = `
                    <img class="estampa-thumb" src="${item.url}" crossorigin="anonymous" onerror="this.src='https://via.placeholder.com/140x110/050814/00f3ff?text=Falta+Img'">
                    <div class="estampa-info">
                        <div class="estampa-id">ESTAMPA #${String(item.id).padStart(3, '0')}</div>
                        <div class="estampa-hash">${item.hash}</div>
                    </div>
                `;
                card.onclick = () => {
                    document.querySelectorAll('.estampa-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedEstampa = item;
                    document.getElementById('editor-panel-title').textContent = `Avisador: ${item.nombreArchivo}`;
                    loadSponsorData();
                    redrawCanvas();
                };
                grid.appendChild(card);
            });

            if (misEstampasDelRepo.length > 0) {
                selectedEstampa = misEstampasDelRepo[0];
                document.getElementById('editor-panel-title').textContent = `Avisador: ${selectedEstampa.nombreArchivo}`;
                loadSponsorData();
                redrawCanvas();
            }
        }

        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');

        function redrawCanvas() {
            if (!selectedEstampa) return;

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = selectedEstampa.url;
            img.onload = () => {
                canvas.width = 600;
                canvas.height = 600;

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "rgba(5, 8, 20, 0.25)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Hora Neón
                ctx.font = "bold 24px 'Orbitron', monospace";
                ctx.fillStyle = "#00f3ff";
                ctx.shadowColor = "#00f3ff";
                ctx.shadowBlur = 12;
                ctx.fillText(document.getElementById('live-time').textContent, 25, 45);

                // Fecha Neón
                ctx.font = "14px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#ffffff";
                ctx.shadowColor = "#ffffff";
                ctx.shadowBlur = 8;
                ctx.fillText(document.getElementById('live-date').textContent, 25, 70);

                // Hash
                ctx.font = "11px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#94a3b8";
                ctx.shadowBlur = 0;
                ctx.fillText(`HASH: ${selectedEstampa.hash}`, 25, canvas.height - 25);

                // Banner Avisador
                const sName = document.getElementById('sponsorName').value.toUpperCase();
                const sPhone = document.getElementById('sponsorPhone').value;
                const sAddress = document.getElementById('sponsorAddress').value;
                const sMsg = document.getElementById('sponsorMsg').value;

                const boxX = 20, boxY = canvas.height - 160, boxW = 560, boxH = 125;

                ctx.save();
                ctx.shadowColor = "#00f3ff";
                ctx.shadowBlur = 15;
                ctx.fillStyle = "rgba(5, 8, 20, 0.92)";
                ctx.strokeStyle = "#00f3ff";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.rect(boxX, boxY, boxW, boxH);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                let textStartX = boxX + 20;
                if (selectedEstampa.logo) {
                    const logoImg = new Image();
                    logoImg.src = selectedEstampa.logo;
                    const logoSize = 85;
                    const logoX = boxX + 15;
                    const logoY = boxY + 20;
                    
                    ctx.fillStyle = "#000";
                    ctx.fillRect(logoX, logoY, logoSize, logoSize);
                    ctx.strokeStyle = "#00f3ff";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(logoX, logoY, logoSize, logoSize);
                    ctx.drawImage(logoImg, logoX, logoY, logoSize, logoSize);
                    textStartX = boxX + 115; 
                }

                ctx.font = "bold 21px 'Orbitron', monospace";
                ctx.fillStyle = "#00f3ff";
                ctx.shadowColor = "#00f3ff";
                ctx.shadowBlur = 10;
                ctx.fillText(sName, textStartX, boxY + 30);

                ctx.font = "bold 14px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#ffffff";
                ctx.shadowColor = "#ffffff";
                ctx.shadowBlur = 5;
                ctx.fillText(sPhone, textStartX, boxY + 58);
                ctx.fillText(sAddress, textStartX, boxY + 80);

                ctx.font = "bold 14px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#ff007f";
                ctx.shadowColor = "#ff007f";
                ctx.shadowBlur = 6;
                ctx.fillText(sMsg, textStartX, boxY + 104);

                // Sello Atómico
                ctx.save();
                ctx.translate(canvas.width - 75, 75);
                ctx.beginPath();
                ctx.arc(0, 0, 45, 0, Math.PI * 2);
                ctx.strokeStyle = "#00f3ff";
                ctx.lineWidth = 3;
                ctx.shadowColor = "#00f3ff";
                ctx.shadowBlur = 10;
                ctx.stroke();

                ctx.fillStyle = "#00f3ff";
                ctx.font = "bold 8px 'Orbitron', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("VENTANIYA", 0, -10);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 7px 'Share Tech Mono', monospace";
                ctx.fillText("ATÓMICO", 0, 2);
                ctx.fillStyle = "#ff007f";
                ctx.font = "bold 7px 'Orbitron', monospace";
                ctx.fillText("MDRP", 0, 14);
                ctx.restore();
            };
        }

        ['sponsorName', 'sponsorPhone', 'sponsorAddress', 'sponsorMsg'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                saveSponsorData();
                redrawCanvas();
            });
        });

        document.getElementById('btnDownload').onclick = () => {
            if(!selectedEstampa) return;
            const link = document.createElement('a');
            link.download = `Estampa-${selectedEstampa.id}-VentaniYA.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        inicializar();
    </script>
</body>
</html>
