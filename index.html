<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera VentaniYA - Visor Principal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-white: #ffffff;
            --neon-pink: #ff007f;
            --bg-dark: #050814;
            --panel-bg: #0b1120;
            --border-glow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-white);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(180deg, #0a1128 0%, #050814 100%);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: var(--border-glow);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
            letter-spacing: 2px;
        }

        .brand p { font-size: 0.85rem; color: #8ab4f8; letter-spacing: 1px; }

        .casio-clock-container {
            background: #000;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3) inset, 0 0 10px var(--neon-blue);
            padding: 8px 16px;
            border-radius: 4px;
            text-align: right;
        }

        .time-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            letter-spacing: 2px;
        }

        .date-display {
            font-size: 0.85rem;
            color: var(--neon-white);
            text-shadow: 0 0 8px var(--neon-white);
            letter-spacing: 1px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 420px;
            flex: 1;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .display-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .cartelera-principal-container {
            width: 100%;
            max-width: 700px;
            background: #000;
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        #cartelera-canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .gallery-section { display: flex; flex-direction: column; gap: 15px; }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--neon-blue);
            border-left: 4px solid var(--neon-blue);
            padding-left: 10px;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .grid-estampas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            max-height: 45vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .grid-estampas::-webkit-scrollbar { width: 6px; }
        .grid-estampas::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 3px; }

        .estampa-card {
            background: var(--panel-bg);
            border: 1px solid #1e293b;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .estampa-card:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
            transform: translateY(-2px);
        }

        .estampa-card.selected {
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .estampa-thumb { width: 100%; height: 100px; object-fit: cover; background: #000; display: block; }
        .estampa-info { padding: 6px; font-size: 0.7rem; text-align: center; }
        .estampa-name { color: var(--neon-blue); font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .editor-panel {
            background: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            box-shadow: var(--border-glow);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            height: fit-content;
        }

        .editor-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; color: var(--neon-blue); letter-spacing: 1px; font-weight: bold; }
        
        .form-group input {
            background: #000;
            border: 1px solid var(--neon-blue);
            color: var(--neon-white);
            padding: 10px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.05rem;
        }

        .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-action {
            background: linear-gradient(90deg, #00f3ff, #0077ff);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border: none;
            padding: 12px 8px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            transition: all 0.2s;
            text-align: center;
            font-size: 0.75rem;
        }

        .btn-action:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }

        .btn-secondary {
            background: linear-gradient(90deg, #ff007f, #aa0055);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }
        .btn-secondary:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }

        .status-msg {
            font-size: 0.8rem;
            color: #00f3ff;
            text-align: center;
            min-height: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>VENTANIYA</h1>
            <p>CARTELERA OFICIAL EN VIVO</p>
        </div>
        <div class="casio-clock-container">
            <div id="live-time" class="time-display">00:00:00.000</div>
            <div id="live-date" class="date-display">00.XXX.0000</div>
        </div>
    </header>

    <div class="main-layout">
        <!-- PANTALLA / VENTANA PRINCIPAL DE LA CARTELERA -->
        <div class="display-section">
            <div class="section-title" style="align-self: flex-start;">Ventana de Cartelera en Vivo</div>
            <div class="cartelera-principal-container">
                <canvas id="cartelera-canvas" width="800" height="800"></canvas>
            </div>
        </div>

        <!-- PANEL DE CONTROL -->
        <div class="editor-panel">
            <div class="editor-title">Panel de Control</div>
            
            <div class="form-group">
                <label>Nombre del Comercio:</label>
                <input type="text" id="sponsorName" value="COMERCIO AUSPICIANTE">
            </div>

            <div class="form-group">
                <label>Teléfono:</label>
                <input type="text" id="sponsorPhone" value="+54 9 11 0000-0000">
            </div>

            <div class="form-group">
                <label>Dirección:</label>
                <input type="text" id="sponsorAddress" value="Av. Principal 123">
            </div>

            <div class="form-group">
                <label>Instagram / Mensaje:</label>
                <input type="text" id="sponsorMsg" value="@tucomercio">
            </div>

            <div class="section-title" style="margin-top: 5px;">Seleccionar Estampa:</div>
            <div class="grid-estampas" id="gridEstampas">
                <div style="color: var(--neon-blue); padding: 10px;">Cargando...</div>
            </div>

            <div class="status-msg" id="statusMsg"></div>

            <!-- BOTÓN 1: Manda los datos fijos a la ventana principal. BOTÓN 2: Descarga -->
            <div class="btn-container">
                <button class="btn-action" id="btnSetFixed">1. Dejar Fijo en Pantalla</button>
                <button class="btn-action btn-secondary" id="btnDownload">2. Descargar Estampa</button>
            </div>
        </div>
    </div>

    <script>
        const mesesShort = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SET", "OCT", "NOV", "DIC"];

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ms = String(now.getMilliseconds()).padStart(3, '0');
            document.getElementById('live-time').textContent = `${h}:${m}:${s}.${ms}`;

            const day = String(now.getDate()).padStart(2, '0');
            const month = mesesShort[now.getMonth()];
            const year = now.getFullYear();
            document.getElementById('live-date').textContent = `${day}.${month}.${year}`;
        }
        setInterval(updateClock, 30);

        let selectedPath = null;
        const grid = document.getElementById('gridEstampas');

        // Cargar datos guardados previamente en la memoria del navegador si existen
        if(localStorage.getItem('ventaniya_name')) document.getElementById('sponsorName').value = localStorage.getItem('ventaniya_name');
        if(localStorage.getItem('ventaniya_phone')) document.getElementById('sponsorPhone').value = localStorage.getItem('ventaniya_phone');
        if(localStorage.getItem('ventaniya_address')) document.getElementById('sponsorAddress').value = localStorage.getItem('ventaniya_address');
        if(localStorage.getItem('ventaniya_msg')) document.getElementById('sponsorMsg').value = localStorage.getItem('ventaniya_msg');

        async function cargarRepositorioAutomatico() {
            try {
                const response = await fetch('https://api.github.com/repos/ventaniyasoluciones-blip/carteleratres/contents');
                const files = await response.json();
                const imagenes = files.filter(file => file.type === 'file' && /\.(png|jpg|jpeg)$/i.test(file.name));

                grid.innerHTML = '';
                if (imagenes.length === 0) {
                    grid.innerHTML = '<div style="color: var(--neon-pink);">No hay imágenes.</div>';
                    return;
                }

                let savedImage = localStorage.getItem('ventaniya_image') || imagenes[0].name;

                imagenes.forEach((file) => {
                    const card = document.createElement('div');
                    card.className = `estampa-card ${file.name === savedImage ? 'selected' : ''}`;
                    card.innerHTML = `
                        <img class="estampa-thumb" src="${file.name}" alt="${file.name}" crossorigin="anonymous">
                        <div class="estampa-info"><div class="estampa-name">${file.name}</div></div>
                    `;

                    card.addEventListener('click', () => {
                        document.querySelectorAll('.estampa-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        selectedPath = file.name;
                    });

                    grid.appendChild(card);

                    if (file.name === savedImage) {
                        selectedPath = file.name;
                    }
                });

                if (!selectedPath && imagenes.length > 0) {
                    selectedPath = imagenes[0].name;
                }

                // Renderizar la pantalla principal al iniciar con lo guardado
                renderCarteleraPrincipal();

            } catch (error) {
                grid.innerHTML = '<div style="color: var(--neon-pink);">Error al conectar.</div>';
            }
        }

        const canvas = document.getElementById('cartelera-canvas');
        const ctx = canvas.getContext('2d');

        function renderCarteleraPrincipal() {
            // Usamos los datos guardados oficiales en localStorage para reflejar lo que está FIJO en la pantalla
            const activeImage = localStorage.getItem('ventaniya_image') || selectedPath;
            if (!activeImage) return;

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = activeImage;
            
            img.onload = () => {
                canvas.width = 800;
                canvas.height = 800;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "rgba(5, 8, 20, 0.25)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Reloj y fecha en pantalla principal
                ctx.font = "bold 32px 'Orbitron', monospace";
                ctx.fillStyle = "#00f3ff";
                ctx.shadowColor = "#00f3ff";
                ctx.shadowBlur = 12;
                ctx.fillText(document.getElementById('live-time').textContent, 35, 60);

                ctx.font = "18px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#ffffff";
                ctx.shadowColor = "#ffffff";
                ctx.shadowBlur = 8;
                ctx.fillText(document.getElementById('live-date').textContent, 35, 95);

                // Sello
                ctx.save();
                ctx.translate(canvas.width - 95, 95);
                ctx.beginPath();
                ctx.arc(0, 0, 55, 0, Math.PI * 2);
                ctx.strokeStyle = "#00f3ff";
                ctx.lineWidth = 4;
                ctx.shadowColor = "#00f3ff";
                ctx.shadowBlur = 12;
                ctx.stroke();

                ctx.fillStyle = "#00f3ff";
                ctx.font = "bold 10px 'Orbitron', monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("VENTANIYA", 0, -12);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 9px 'Share Tech Mono', monospace";
                ctx.fillText("ATÓMICO", 0, 2);
                ctx.fillStyle = "#ff007f";
                ctx.font = "bold 9px 'Orbitron', monospace";
                ctx.fillText("MDRP", 0, 16);
                ctx.restore();

                // Recuadro de auspicio fijo en la ventana principal
                const sName = (localStorage.getItem('ventaniya_name') || document.getElementById('sponsorName').value).toUpperCase();
                const sPhone = localStorage.getItem('ventaniya_phone') || document.getElementById('sponsorPhone').value;
                const sAddress = localStorage.getItem('ventaniya_address') || document.getElementById('sponsorAddress').value;
                const sMsg = localStorage.getItem('ventaniya_msg') || document.getElementById('sponsorMsg').value;

                const boxX = 25, boxY = canvas.height - 170, boxW = 750, boxH = 140;

                ctx.save();
                ctx.shadowColor = "#00f3ff";
                ctx.shadowBlur = 18;
                ctx.fillStyle = "rgba(5, 8, 20, 0.95)";
                ctx.strokeStyle = "#00f3ff";
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.rect(boxX, boxY, boxW, boxH);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                let textStartX = boxX + 25;
                ctx.font = "bold 26px 'Orbitron', monospace";
                ctx.fillStyle = "#00f3ff";
                ctx.shadowColor = "#00f3ff";
                ctx.shadowBlur = 10;
                ctx.fillText(sName, textStartX, boxY + 38);

                ctx.font = "bold 17px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#ffffff";
                ctx.shadowColor = "#ffffff";
                ctx.shadowBlur = 5;
                ctx.fillText(sPhone, textStartX, boxY + 72);
                ctx.fillText(sAddress, textStartX, boxY + 98);

                ctx.font = "bold 17px 'Share Tech Mono', monospace";
                ctx.fillStyle = "#ff007f";
                ctx.shadowColor = "#ff007f";
                ctx.shadowBlur = 6;
                ctx.fillText(sMsg, textStartX, boxY + 124);
            };
        }

        // BOTÓN 1: Guarda los cambios y actualiza de inmediato la PANTALLA PRINCIPAL de la cartelera
        document.getElementById('btnSetFixed').onclick = () => {
            if(!selectedPath) return;
            localStorage.setItem('ventaniya_name', document.getElementById('sponsorName').value);
            localStorage.setItem('ventaniya_phone', document.getElementById('sponsorPhone').value);
            localStorage.setItem('ventaniya_address', document.getElementById('sponsorAddress').value);
            localStorage.setItem('ventaniya_msg', document.getElementById('sponsorMsg').value);
            localStorage.setItem('ventaniya_image', selectedPath);

            renderCarteleraPrincipal();
            const msg = document.getElementById('statusMsg');
            msg.textContent = "¡Aviso fijado en la pantalla principal!";
            setTimeout(() => { msg.textContent = ""; }, 3500);
        };

        // BOTÓN 2: Es el ÚNICO botón que descarga la estampa de la pantalla principal a la PC
        document.getElementById('btnDownload').onclick = () => {
            renderCarteleraPrincipal();
            setTimeout(() => {
                const link = document.createElement('a');
                link.download = `Estampa-Cartelera-Principal.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }, 100);
        };

        cargarRepositorioAutomatico();
    </script>
</body>
</html>
